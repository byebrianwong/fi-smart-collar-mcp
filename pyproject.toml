[project]
name = "fi-mcp"
version = "0.1.0"
description = "Read-only MCP server that gives Claude your dog or cat's Fi collar data (activity, sleep, behavior)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brian Wong" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.3",
]

[project.urls]
Repository = "https://github.com/byebrianwong/fi-smart-collar-mcp"

[project.scripts]
fi-mcp = "fi_mcp.server:main"
fi-mcp-setup = "fi_mcp.setup_cli:main"
fi-mcp-snapshot = "fi_mcp.server:snapshot_cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
